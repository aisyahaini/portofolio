<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E14" />
    <title>Aisyah Nuraini — AI Engineer &amp; Full-Stack Developer</title>
    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : "dark"; // site's default look stays dark unless the user opts into light
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta
      name="description"
      content="Portfolio of Aisyah Nuraini — AI Engineer and full-stack developer working across transformer NLP, explainable AI, computer vision, and production web systems."
    />

    <!-- Open Graph / social share preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aisyah Nuraini — AI Engineer &amp; Full-Stack Developer" />
    <meta
      property="og:description"
      content="AI Engineer and full-stack developer working across transformer NLP, explainable AI, computer vision, and production web systems."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aisyah Nuraini — AI Engineer &amp; Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="AI Engineer and full-stack developer working across transformer NLP, explainable AI, computer vision, and production web systems."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-bg text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
